<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共享快照相册</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { min-height: 100vh; background: linear-gradient(145deg, #0b1a2e 0%, #1a2f42 100%); display: flex; justify-content: center; align-items: center; padding: 1.5rem; }
  .app { max-width: 800px; width: 100%; background: rgba(18,30,41,0.9); backdrop-filter: blur(16px); border-radius: 2.5rem; box-shadow: 0 30px 50px rgba(0,0,0,0.7); padding: 2rem; color: #eef4ff; }
  h1 { font-size: 1.8rem; font-weight: 500; display: flex; align-items: center; gap: 0.6rem; color: #fff; }
  h1 span { background: #3b82f6; width: 2.2rem; height: 2.2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .sub { display: flex; justify-content: space-between; margin-bottom: 1.8rem; color: #a2b9d4; font-size: 0.95rem; border-bottom: 1px solid #2e4057; padding-bottom: 0.8rem; flex-wrap: wrap; gap: 0.5rem; }
  .badge { background: #1e2f44; padding: 0.35rem 1rem; border-radius: 40px; font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem; border: 1px solid #3d5a78; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #facc15; }
  .dot.on { background: #10b981; box-shadow: 0 0 10px #10b981; }
  .dot.err { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
  video { position: absolute; width: 1px; height: 1px; opacity: 0; top: -9999px; left: -9999px; }
  .menu { display: flex; flex-direction: column; gap: 1.2rem; margin-top: 1.8rem; }
  .btn { background: #1e2e40; border: 1px solid #36516b; color: #f0f7ff; padding: 1.4rem 1.8rem; border-radius: 1.6rem; font-size: 1.15rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; width: 100%; text-align: left; transition: 0.2s; }
  .btn:hover { background: #2a3f58; border-color: #53799e; }
  .btn:disabled { opacity: 0.4; pointer-events: none; }
  .btn .ico { font-size: 1.8rem; width: 3rem; height: 3rem; background: #0e1a26; border-radius: 1.2rem; display: flex; align-items: center; justify-content: center; border: 1px solid #2e4a66; }
  .btn small { display: block; font-size: 0.8rem; color: #8aa3be; margin-top: 0.2rem; }
  .btn.primary { background: #2563eb; border-color: #3b82f6;  }
  .btn.primary:hover { background: #1d4ed8; }
  .view { display: none; flex-direction: column; gap: 1.5rem; margin-top: 1rem; }
  .view.on { display: flex; }
  .vhead { display: flex; justify-content: space-between; align-items: center; }
  .vhead h2 { font-size: 1.3rem; font-weight: 500; color: #d9e9ff; }
  .count { background: #1e2f44; padding: 0.3rem 1.1rem; border-radius: 40px; font-size: 0.85rem; border: 1px solid #3a5570; color: #b9d0ea; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; max-height: 380px; overflow-y: auto; padding: 0.3rem 0; }
  .card { aspect-ratio: 1/1; background: #101f2e; border-radius: 1.2rem; overflow: hidden; border: 2px solid #20384d; cursor: pointer; transition: 0.2s; }
  .card:hover { border-color: #3b82f6; transform: scale(1.02); }
  .card img { width: 100%; height: 100%; object-fit: cover; }
 .card { position: relative; }
.card .del {
  position: absolute; top: 6px; right: 6px;
  background: rgba(220,38,38,0.85); color: #fff;
  border: none; border-radius: 50%;
  width: 26px; height: 26px; font-size: 14px;
  cursor: pointer; display: none;
  align-items: center; justify-content: center;
  line-height: 1; padding: 0;
}
.card:hover .del { display: flex; }
  .empty { grid-column: 1/-1; display: flex; flex-direction: column; align-items: center; padding: 3rem; color: #6e8aa8; background: #0b1620; border-radius: 1.5rem; border: 2px dashed #1e3347; gap: 0.5rem; }
  .back { background: #1e2e40; border: 1px solid #36516b; color: #eef4ff; padding: 0.8rem 1.6rem; border-radius: 2.5rem; cursor: pointer; width: fit-content; transition: 0.15s; }
  .back:hover { background: #2a3f58; }
  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e2e40; color: white; padding: 0.8rem 1.8rem; border-radius: 50px; border-left: 5px solid #3b82f6; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.8); transition: transform 0.3s; z-index: 999; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .flash { position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 9999; }
  .flash.on { opacity: 0.7; }
  .note { margin-top: 1.5rem; font-size: 0.75rem; color: #5f7991; text-align: center; border-top: 1px solid #1f3244; padding-top: 1rem; }
</style>
</head>
<body>
<div class="app">
  <h1><span>📸</span> 共享快照相册</h1>
  <div class="sub">
    <div>允许摄像头后自动拍照 · 所有人共享</div>
    <div class="badge"><span class="dot" id="dot"></span><span id="status">等待摄像头</span></div>
  </div>

  <video id="video" autoplay playsinline muted></video>

  <div class="menu" id="menu">
    <button class="btn primary" id="viewBtn">
      <div class="ico">🖼️</div>
      <div><span>查看照片</span><small>浏览所有人拍摄的照片</small></div>
    </button>
    <button class="btn" id="shotBtn" disabled>
      <div class="ico">📷</div>
      <div><span>再拍一张</span><small>使用摄像头拍摄新照片</small></div>
    </button>
  </div>

  <div class="view" id="view">
    <div class="vhead">
      <h2>📁 共享照片墙</h2>
      <div class="count" id="count">0 张</div>
    </div>
    <div class="grid" id="grid"></div>
    <button class="back" id="backBtn">← 返回菜单</button>
  </div>

  <div class="note">⚡ 所有访客拍的照片都会汇总到这里，实时共享。</div>
</div>

<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>

<script>
(function() {
  // ============================================================
  //  ⚠️ 把下面这一行替换成你自己的 Worker 地址 ⚠️
  //  格式类似：https://photo-album-api.xxxxxxxx.workers.dev
  // ============================================================
  const API_BASE = 'https://api.limo-photos.xyz';
  // ============================================================

  const video = document.getElementById('video');
  const viewBtn = document.getElementById('viewBtn');
  const shotBtn = document.getElementById('shotBtn');
  const menu = document.getElementById('menu');
  const view = document.getElementById('view');
  const backBtn = document.getElementById('backBtn');
  const grid = document.getElementById('grid');
  const count = document.getElementById('count');
  const dot = document.getElementById('dot');
  const status = document.getElementById('status');
  const flash = document.getElementById('flash');
  const toast = document.getElementById('toast');

  let stream = null, photos = [], autoDone = false, toastTimer = null, ready = false;

  function showToast(msg, dur = 2000) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), dur);
  }

  function setStatus(type, text) {
    dot.className = 'dot' + (type === 'on' ? ' on' : type === 'err' ? ' err' : '');
    status.textContent = text;
  }

  async function loadPhotos() {
    try {
      const res = await fetch(API_BASE + '/api/photos');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (Array.isArray(data)) photos = data;
    } catch (e) {
      showToast('加载照片失败，请稍后重试', 2500);
    }
    render();
  }

  async function uploadPhoto(dataUrl) {
    try {
      const res = await fetch(API_BASE + '/api/photos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dataUrl }),
      });
      return res.ok;
    } catch (e) {
      showToast('上传失败，请检查网络', 2500);
      return false;
    }
  }

  function render() {
    grid.innerHTML = '';
    if (photos.length === 0) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '<div style="font-size:2rem">📷</div><span>还没有照片</span><small style="opacity:0.7">允许摄像头后会自动拍照</small>';
      grid.appendChild(e);
    } else {
      [...photos].sort((a, b) => (b.time || 0) - (a.time || 0)).forEach(p => {
  const c = document.createElement('div');
  c.className = 'card';
  const img = document.createElement('img');
  img.src = p.dataUrl;
  img.loading = 'lazy';
  c.appendChild(img);
  c.onclick = () => window.open(p.dataUrl, '_blank');
  grid.appendChild(c);
});
    count.textContent = photos.length + ' 张';
  }

  function flashEffect() {
    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 150);
  }

  function capture() {
    if (!video.videoWidth) return null;
    const c = document.createElement('canvas');
    c.width = video.videoWidth;
    c.height = video.videoHeight;
    const ctx = c.getContext('2d');
    ctx.translate(c.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0);
    return c.toDataURL('image/jpeg', 0.7);
  }

  async function takePhoto(auto = false) {
    if (!stream || !video.srcObject) { if (!auto) showToast('摄像头未就绪'); return; }
    const dataUrl = capture();
    if (!dataUrl) return;
    flashEffect();
    showToast(auto ? '✨ 自动拍照已上传' : '📸 拍照已上传');
    const ok = await uploadPhoto(dataUrl);
    if (ok) await loadPhotos();
  }

  function stopStream() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    ready = false;
    shotBtn.disabled = true;
  }

  async function initCamera() {
    stopStream();
    autoDone = false;
    ready = false;
    shotBtn.disabled = true;
    setStatus('', '请求权限中...');
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      stream = s;
      video.srcObject = s;
      await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = r; });
      await video.play();
      setStatus('on', '摄像头已就绪');
      ready = true;
      shotBtn.disabled = false;
      if (!autoDone) {
        autoDone = true;
        setTimeout(() => { if (stream && video.srcObject) takePhoto(true); }, 250);
      }
    } catch (e) {
      setStatus('err', '权限被拒绝');
      shotBtn.disabled = true;
      showToast(e.name === 'NotAllowedError' ? '请允许摄像头权限' : '摄像头启动失败', 3000);
    }
  }

  viewBtn.onclick = async () => {
    menu.style.display = 'none';
    view.classList.add('on');
    await loadPhotos();
  };
  backBtn.onclick = () => {
    view.classList.remove('on');
    menu.style.display = 'flex';
  };
  shotBtn.onclick = () => takePhoto(false);

  window.addEventListener('beforeunload', stopStream);

  render();
  setTimeout(initCamera, 0);
  setInterval(() => { if (view.classList.contains('on')) loadPhotos(); }, 10000);
})();
</script>
</body>
</html>
