<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共享快照相册</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { min-height: 100vh; background: linear-gradient(145deg, #0b1a2e 0%, #1a2f42 100%); display: flex; justify-content: center; align-items: center; padding: 1.5rem; }
  .app { max-width: 800px; width: 100%; background: rgba(18,30,41,0.9); backdrop-filter: blur(16px); border-radius: 2.5rem; box-shadow: 0 30px 50px rgba(0,0,0,0.7); padding: 2rem; color: #eef4ff; }
  h1 { font-size: 1.8rem; font-weight: 500; display: flex; align-items: center; gap: 0.6rem; color: #fff; margin-bottom: 1rem; user-select: none; }
  h1 span { background: #3b82f6; width: 2.2rem; height: 2.2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; }
  .sub { margin-bottom: 1.8rem; color: #a2b9d4; font-size: 0.95rem; border-bottom: 1px solid #2e4057; padding-bottom: 0.8rem; }
  video { position: absolute; width: 1px; height: 1px; opacity: 0; top: -9999px; left: -9999px; }
  .btn { background: #2563eb; border: none; color: #fff; padding: 1.4rem 1.8rem; border-radius: 1.6rem; font-size: 1.15rem; cursor: pointer; width: 100%; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.6rem; }
  .btn:hover { background: #1d4ed8; }
  .btn:disabled { opacity: 0.4; pointer-events: none; }
  .btn.gray { background: #1e2e40; border: 1px solid #36516b; }
  .btn.gray:hover { background: #2a3f58; }
  .btn.small { padding: 1rem 1.2rem; font-size: 1rem; border-radius: 1.2rem; }
  .btn.active { background: #2563eb; border-color: #3b82f6; }
  .input { background: #1e2f44; border: 1px solid #3d5a78; color: #fff; width: 100%; padding: 1.1rem 1.2rem; border-radius: 1.2rem; margin-bottom: 1rem; font-size: 1.1rem; text-align: center; letter-spacing: 0.05em; }
  .input:focus { outline: none; border-color: #3b82f6; }
  .row { display: flex; gap: 0.8rem; margin-top: 0.8rem; }
  .row .btn { padding: 0.9rem; font-size: 0.95rem; }
  .badge { background: #1e2f44; padding: 0.35rem 1rem; border-radius: 40px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.4rem; border: 1px solid #3d5a78; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #facc15; }
  .dot.on { background: #10b981; box-shadow: 0 0 10px #10b981; }
  .dot.err { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
  .view { display: none; flex-direction: column; gap: 1.5rem; margin-top: 1rem; }
  .view.on { display: flex; }
  .vhead { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
  .vhead h2 { font-size: 1.3rem; font-weight: 500; color: #d9e9ff; }
  .vhead-right { display: flex; align-items: center; gap: 0.5rem; }
  .count { background: #1e2f44; padding: 0.3rem 1.1rem; border-radius: 40px; font-size: 0.85rem; border: 1px solid #3a5570; color: #b9d0ea; }
  .refresh-btn { background: #1e2e40; border: 1px solid #36516b; color: #eef4ff; padding: 0.4rem 0.9rem; border-radius: 40px; font-size: 0.8rem; cursor: pointer; }
  .refresh-btn:hover { background: #2a3f58; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; max-height: 380px; overflow-y: auto; padding: 0.3rem 0; }
  .card { aspect-ratio: 1/1; background: #101f2e; border-radius: 1.2rem; overflow: hidden; border: 2px solid #20384d; transition: 0.2s; position: relative; }
  .card img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
  .card .del { position: absolute; top: 6px; right: 6px; background: rgba(220,38,38,0.85); color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 15px; cursor: pointer; display: none; align-items: center; justify-content: center; line-height: 1; padding: 0; }
  .card:hover .del, .card .del.show { display: flex; }
  .empty { grid-column: 1/-1; display: flex; flex-direction: column; align-items: center; padding: 3rem; color: #6e8aa8; background: #0b1620; border-radius: 1.5rem; border: 2px dashed #1e3347; gap: 0.5rem; }
  .back { background: #1e2e40; border: 1px solid #36516b; color: #eef4ff; padding: 0.8rem 1.6rem; border-radius: 2.5rem; cursor: pointer; width: fit-content; }
  .back:hover { background: #2a3f58; }
  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e2e40; color: white; padding: 0.8rem 1.8rem; border-radius: 50px; border-left: 5px solid #3b82f6; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.8); transition: transform 0.3s; z-index: 999; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .flash { position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 9999; }
  .flash.on { opacity: 0.7; }
  .note { margin-top: 1.5rem; font-size: 0.75rem; color: #5f7991; text-align: center; border-top: 1px solid #1f3244; padding-top: 1rem; }
  .tips { background: #0e1a26; border: 1px solid #36516b; border-radius: 1.2rem; padding: 1.2rem 1.4rem; margin-bottom: 1.5rem; font-size: 0.9rem; color: #a2b9d4; line-height: 1.7; position: relative; }
  .tips h3 { color: #d9e9ff; font-size: 1rem; margin-bottom: 0.6rem; }
  .tips ol { padding-left: 1.2rem; }
  .tips li { margin-bottom: 0.4rem; }
  .tips b { color: #93c5fd; }
  .close-tips { position: absolute; top: 0.8rem; right: 0.9rem; background: none; border: none; color: #6e8aa8; font-size: 1.1rem; cursor: pointer; padding: 0; line-height: 1; }
  .hidden-file { display: none; }
  .camera-row { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; }
  .camera-row .btn { padding: 0.9rem 1rem; font-size: 0.95rem; border-radius: 1.2rem; }
</style>
</head>
<body>
<div class="app">
  <h1><span id="secretTap">📸</span> 共享快照相册</h1>

  <!-- 主页面 -->
  <div id="homeView">
    <div class="tips" id="tips">
      <button class="close-tips" onclick="document.getElementById('tips').style.display='none'">✕</button>
      <h3>📖 使用说明</h3>
      <ol>
        <li>点 <b>“📷 拍照上传”</b>，允许摄像头后拍照上传。</li>
        <li>点 <b>“📁 上传本地照片”</b>，从手机相册选一张上传。</li>
        <li>点 <b>“🖼️ 查看照片”</b>，可以看到所有人上传的所有照片。</li>
        <li>照片只有上传者本人可以删除。</li>
      </ol>
    </div>

    <button class="btn" id="cameraBtn">📷 拍照上传</button>
    <button class="btn gray" id="uploadBtn" style="margin-top:1rem;">📁 上传本地照片</button>
    <button class="btn gray" id="viewBtn" style="margin-top:1rem;">🖼️ 查看照片</button>
    <input type="file" id="fileInput" class="hidden-file" accept="image/*">

    <div style="margin-top:1.5rem;text-align:center;">
      <span class="badge"><span class="dot" id="dot"></span><span id="status">检查服务中...</span></span>
    </div>
  </div>

  <!-- 管理员登录 -->
  <div id="adminLogin" style="display:none;">
    <div class="sub">输入管理员密码，进入管理后台。</div>
    <input type="password" class="input" id="pwdInput" placeholder="管理员密码">
    <button class="btn" id="loginBtn">进入后台</button>
    <button class="btn gray" id="cancelLogin" style="margin-top:0.8rem;">取消</button>
  </div>

  <!-- 拍照页面 -->
  <div id="shotView" style="display:none;">
    <div class="sub">进入页面会自动请求摄像头权限。可以切换前置/后置。</div>
    <div style="display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1rem;">
      <span class="badge"><span class="dot" id="dot2"></span><span id="status2">请求权限中...</span></span>
    </div>

    <div class="camera-row">
      <button class="btn small" id="shotFront">🤳 前置</button>
      <button class="btn small gray" id="shotBack">📷 后置</button>
    </div>

    <button class="btn" id="shotBtn" disabled>📸 拍一张</button>
    <button class="btn gray" id="shotHomeBtn" style="margin-top:0.8rem;">🏠 返回首页</button>
    <div class="note">⚡ 拍摄后自动上传。</div>
  </div>

  <!-- 相册展示 -->
  <div class="view" id="view">
    <div class="vhead">
      <h2>📁 全部照片</h2>
      <div class="vhead-right">
        <button class="refresh-btn" id="refreshBtn">🔄 刷新</button>
        <div class="count" id="count">0 张</div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <button class="back" id="backBtn">← 返回</button>
  </div>

  <div class="note">⚡ 所有人可以看所有照片，但只能删自己上传的。</div>
</div>

<video id="video" autoplay playsinline muted></video>
<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>

<script>
(function() {
  const API_BASE = 'https://api.limo-photos.xyz';
  const ADMIN_PWD = 'woshiguanliyuan';

  function getOwnerId() {
    let id = localStorage.getItem('photo_owner_id');
    if (!id) {
      id = 'u_' + Math.random().toString(36).substr(2, 10) + Date.now().toString(36);
      localStorage.setItem('photo_owner_id', id);
    }
    return id;
  }
  const MY_OWNER = getOwnerId();

  const video = document.getElementById('video');
  const flash = document.getElementById('flash');
  const toast = document.getElementById('toast');
  const homeView = document.getElementById('homeView');
  const adminLogin = document.getElementById('adminLogin');
  const shotView = document.getElementById('shotView');
  const view = document.getElementById('view');
  const grid = document.getElementById('grid');
  const count = document.getElementById('count');
  const cameraBtn = document.getElementById('cameraBtn');
  const uploadBtn = document.getElementById('uploadBtn');
  const fileInput = document.getElementById('fileInput');
  const viewBtn = document.getElementById('viewBtn');
  const pwdInput = document.getElementById('pwdInput');
  const loginBtn = document.getElementById('loginBtn');
  const cancelLogin = document.getElementById('cancelLogin');
  const backBtn = document.getElementById('backBtn');
  const shotBtn = document.getElementById('shotBtn');
  const shotFront = document.getElementById('shotFront');
  const shotBack = document.getElementById('shotBack');
  const shotHomeBtn = document.getElementById('shotHomeBtn');
  const dot = document.getElementById('dot');
  const status = document.getElementById('status');
  const dot2 = document.getElementById('dot2');
  const status2 = document.getElementById('status2');
  const secretTap = document.getElementById('secretTap');
  const refreshBtn = document.getElementById('refreshBtn');

  let stream = null, photos = [], toastTimer = null;
  let isAdmin = false;
  let cameraReady = false;
  let currentFacing = 'user';

  function showToast(msg, dur = 2000) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), dur);
  }

  async function checkService() {
    try {
      const res = await fetch(API_BASE + '/api/photos');
      if (res.ok) { dot.className = 'dot on'; status.textContent = '服务正常'; }
      else throw new Error();
    } catch (e) { dot.className = 'dot err'; status.textContent = '服务异常'; }
  }

  async function loadPhotos() {
    try {
      const res = await fetch(API_BASE + '/api/photos');
      if (!res.ok) throw new Error();
      const data = await res.json();
      photos = Array.isArray(data) ? data : [];
    } catch (e) { showToast('加载照片失败'); photos = []; }
    render();
  }

  async function uploadPhoto(dataUrl) {
    try {
      const res = await fetch(API_BASE + '/api/photos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dataUrl, room: 'default', owner: MY_OWNER }),
      });
      return res.ok;
    } catch (e) { return false; }
  }

  async function deletePhoto(id) {
    try {
      const res = await fetch(API_BASE + '/api/photos', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, owner: MY_OWNER, admin: isAdmin }),
      });
      if (res.status === 403) return 'forbidden';
      return res.ok ? 'ok' : 'fail';
    } catch (e) { return 'fail'; }
  }

  function render() {
    grid.innerHTML = '';
    if (photos.length === 0) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '<div style="font-size:2rem">📷</div><span>还没有照片</span>';
      grid.appendChild(e);
    } else {
      [...photos].sort((a, b) => (b.time || 0) - (a.time || 0)).forEach(p => {
        const c = document.createElement('div');
        c.className = 'card';
        const img = document.createElement('img');
        img.src = p.dataUrl;
        img.loading = 'lazy';
        img.onclick = () => window.open(p.dataUrl, '_blank');
        c.appendChild(img);

        const canDelete = isAdmin || p.owner === MY_OWNER;
        if (canDelete) {
          const del = document.createElement('button');
          del.className = 'del';
          del.textContent = '✕';
          del.onclick = async (e) => {
            e.stopPropagation();
            if (!confirm('确定删除这张照片吗？')) return;
            const r = await deletePhoto(p.id);
            if (r === 'ok') { showToast('已删除'); await loadPhotos(); }
            else if (r === 'forbidden') showToast('只能删自己上传的照片');
            else showToast('删除失败');
          };
          c.appendChild(del);

          let pt = null;
          c.addEventListener('touchstart', () => { pt = setTimeout(() => del.classList.add('show'), 500); });
          c.addEventListener('touchend', () => clearTimeout(pt));
          c.addEventListener('touchmove', () => clearTimeout(pt));
        }

        grid.appendChild(c);
      });
    }
    count.textContent = photos.length + ' 张';
  }

  function flashEffect() {
    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 150);
  }

  function capture() {
    if (!video.videoWidth) return null;
    const c = document.createElement('canvas');
    c.width = video.videoWidth;
    c.height = video.videoHeight;
    const ctx = c.getContext('2d');
    if (currentFacing === 'user') {
      ctx.translate(c.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, 0, 0);
    return c.toDataURL('image/jpeg', 0.7);
  }

  async function initCamera(facing) {
    facing = facing || currentFacing;
    currentFacing = facing;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    cameraReady = false;
    shotBtn.disabled = true;

    if (dot2) { dot2.className = 'dot'; status2.textContent = '请求权限中...'; }

    try {
      const s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing },
        audio: false,
      });
      stream = s;
      video.srcObject = s;
      await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = r; });
      await video.play();
      if (dot2) { dot2.className = 'dot on'; status2.textContent = facing === 'user' ? '前置已就绪' : '后置已就绪'; }
      cameraReady = true;
      shotBtn.disabled = false;
      // 更新按钮高亮
      if (facing === 'user') {
        shotFront.classList.remove('gray');
        shotFront.classList.add('active');
        shotBack.classList.add('gray');
        shotBack.classList.remove('active');
      } else {
        shotBack.classList.remove('gray');
        shotBack.classList.add('active');
        shotFront.classList.add('gray');
        shotFront.classList.remove('active');
      }
    } catch (e) {
      if (dot2) { dot2.className = 'dot err'; status2.textContent = '权限被拒绝'; }
      cameraReady = false;
      shotBtn.disabled = false;
      showToast('请允许摄像头权限', 3000);
    }
  }

  async function takePhoto() {
    if (!cameraReady || !stream) {
      showToast('正在请求摄像头权限...');
      await initCamera();
      return;
    }
    const dataUrl = capture();
    if (!dataUrl) return;
    flashEffect();
    showToast('📸 拍照已上传');
    const ok = await uploadPhoto(dataUrl);
    if (!ok) showToast('上传失败');
  }

  function stopStream() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    cameraReady = false;
    shotBtn.disabled = true;
  }

  function handleFileUpload(file) {
    if (!file) return;
    if (!file.type.startsWith('image/')) { showToast('请选择图片'); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxSize = 1600;
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
          else { w = Math.round(w * maxSize / h); h = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        (async () => {
          showToast('上传中...');
          const ok = await uploadPhoto(dataUrl);
          if (ok) showToast('✅ 上传成功');
          else showToast('上传失败');
        })();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  let tapCount = 0, tapTimer = null;
  if (secretTap) {
    secretTap.onclick = () => {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
      if (tapCount >= 5) {
        tapCount = 0;
        homeView.style.display = 'none';
        adminLogin.style.display = 'block';
      }
    };
  }

  // 点“拍照上传” → 进入拍照页面 → 自动请求摄像头权限
  if (cameraBtn) {
    cameraBtn.onclick = () => {
      homeView.style.display = 'none';
      shotView.style.display = 'block';
      currentFacing = 'user';
      shotFront.classList.add('active');
      shotFront.classList.remove('gray');
      shotBack.classList.add('gray');
      shotBack.classList.remove('active');
      setTimeout(() => initCamera('user'), 100);
    };
  }

  if (uploadBtn) {
    uploadBtn.onclick = () => fileInput.click();
  }
  if (fileInput) {
    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      handleFileUpload(file);
      fileInput.value = '';
    };
  }

  if (viewBtn) {
    viewBtn.onclick = async () => {
      homeView.style.display = 'none';
      view.classList.add('on');
      await loadPhotos();
    };
  }

  if (refreshBtn) {
    refreshBtn.onclick = () => {
      if (view.classList.contains('on')) {
        loadPhotos();
        showToast('已刷新');
      }
    };
  }

  if (cancelLogin) {
    cancelLogin.onclick = () => {
      adminLogin.style.display = 'none';
      homeView.style.display = 'block';
      pwdInput.value = '';
    };
  }
  if (loginBtn) {
    loginBtn.onclick = async () => {
      if (pwdInput.value !== ADMIN_PWD) {
        showToast('密码错误');
        return;
      }
      isAdmin = true;
      adminLogin.style.display = 'none';
      view.classList.add('on');
      await loadPhotos();
    };
  }

  if (backBtn) {
    backBtn.onclick = () => {
      view.classList.remove('on');
      homeView.style.display = 'block';
      isAdmin = false;
    };
  }
  if (shotBtn) shotBtn.onclick = () => takePhoto();
  if (shotFront) shotFront.onclick = () => initCamera('user');
  if (shotBack) shotBack.onclick = () => initCamera('environment');
  if (shotHomeBtn) {
    shotHomeBtn.onclick = () => {
      stopStream();
      shotView.style.display = 'none';
      homeView.style.display = 'block';
    };
  }

  window.addEventListener('beforeunload', stopStream);

  checkService();
})();
</script>
</body>
</html>
